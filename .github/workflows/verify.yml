name: verify

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Check manifests and sources
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs = require('fs');

          const templates = {
            'node-typescript': {
              name: 'MyNodePlugin',
              command: ['node', './hosihikari.mjs', './dist/main.js'],
              files: ['hosihikari.mjs', 'src/main.ts', 'hosihikari.d.ts', 'tsconfig.json', 'package.json', 'MyNodePlugin.conf'],
            },
            python: {
              name: 'MyPythonPlugin',
              command: ['python3', './hosihikari.py', './main.py'],
              files: ['main.py', 'hosihikari.py', 'hosihikari.pyi', 'MyPythonPlugin.conf'],
            },
            kotlin: {
              name: 'MyKotlinPlugin',
              command: ['java', '-cp', './plugin.jar', 'hosihikari.Binding', 'myplugin.MyKotlinPlugin'],
              files: ['src/MyKotlinPlugin.kt', 'hosihikari/Binding.java', 'build.sh', 'build.ps1', 'MyKotlinPlugin.conf'],
            },
          };

          for (const [dir, expected] of Object.entries(templates)) {
            if (fs.existsSync(`${dir}/manifest.json`)) throw new Error(`${dir}: committed manifest.json`);
            const manifest = JSON.parse(fs.readFileSync(`${dir}/hosihikari.json`, 'utf8'));
            if (manifest.name !== expected.name) throw new Error(`${dir}: name`);
            if (manifest.kind !== 'plugin') throw new Error(`${dir}: kind`);
            if (manifest.apiVersion !== 3) throw new Error(`${dir}: apiVersion`);
            if (!manifest.entry) throw new Error(`${dir}: entry`);
            if (manifest.loader !== 'rpc') throw new Error(`${dir}: loader`);
            const command = manifest.pack?.command;
            if (JSON.stringify(command) !== JSON.stringify(expected.command)) {
              throw new Error(`${dir}: command ${JSON.stringify(command)}`);
            }
            for (const file of expected.files) {
              if (!fs.existsSync(`${dir}/${file}`)) throw new Error(`${dir}: missing ${file}`);
            }
          }
          JS

  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: RpcLoader
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/RpcLoader
          path: RpcLoader
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Compare protocol definition copies
        run: |
          set -euo pipefail
          diff -u RpcLoader/protocol/node/hosihikari.mjs node-typescript/hosihikari.mjs
          diff -u RpcLoader/protocol/node/hosihikari.d.ts node-typescript/hosihikari.d.ts
          diff -u RpcLoader/protocol/python/hosihikari.py python/hosihikari.py
          diff -u RpcLoader/protocol/python/hosihikari.pyi python/hosihikari.pyi
          diff -ru RpcLoader/protocol/java/hosihikari kotlin/hosihikari

  node-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Build
        working-directory: node-typescript
        run: |
          npm ci
          npm run build
          test -f dist/main.js
      - name: Handshake
        working-directory: node-typescript
        run: |
          set -euo pipefail
          mkdir -p data
          python3 "$GITHUB_WORKSPACE/.github/handshake.py" MyNodePlugin \
            node ./hosihikari.mjs ./dist/main.js
          test -f data/loaded.txt

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check syntax
        working-directory: python
        run: python3 -m py_compile main.py hosihikari.py
      - name: Handshake
        working-directory: python
        run: |
          set -euo pipefail
          mkdir -p data
          python3 "$GITHUB_WORKSPACE/.github/handshake.py" MyPythonPlugin \
            python3 ./hosihikari.py ./main.py
          test -f data/loaded.txt

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: graalvm-community
          java-version: '25'
      - name: Install Kotlin compiler
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/kotlin.zip" \
            https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Build
        working-directory: kotlin
        run: |
          ./build.sh
          test -f plugin.jar
          unzip -l plugin.jar | grep -q 'hosihikari/Binding.class'
      - name: Handshake
        working-directory: kotlin
        run: |
          set -euo pipefail
          mkdir -p data
          python3 "$GITHUB_WORKSPACE/.github/handshake.py" MyKotlinPlugin \
            java -cp ./plugin.jar hosihikari.Binding myplugin.MyKotlinPlugin
          test -f data/loaded.txt

  pack:
    runs-on: ubuntu-latest
    steps:
      - name: 模板
        uses: actions/checkout@v7
        with:
          path: template

      - name: 核心
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/PluginManager
          path: PluginManager
          # 跨仓并列检出必须钉同名分支（ADR-0059）。
          ref: ${{ github.head_ref || github.ref_name }}

      - name: 契约
        uses: actions/checkout@v7
        with:
          # 核心按 ../Plugin.Abstractions 找契约源码（ADR-0059 的并列约定），目录名必须对上。
          repository: HosihikariFramework/PluginAbstractions
          path: Plugin.Abstractions
          ref: ${{ github.head_ref || github.ref_name }}

      - name: McMaster fork
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/DotNetCorePlugins
          path: DotNetCorePlugins

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      # Kotlin 的入口 jar 由 build.sh 产出，打包脚本只搬现成的：干净检出里要先编出来。
      - uses: actions/setup-java@v6
        with:
          distribution: graalvm-community
          java-version: '25'

      - name: Kotlin 编译器
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kotlin.zip" \
            https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"

      - name: 打包
        env:
          HOSIHIKARI_PLUGINMANAGER: ${{ github.workspace }}/PluginManager
        run: |
          set -euo pipefail
          (cd template/node-typescript && npm ci && npm run build)
          (cd template/kotlin && ./build.sh)
          test -f template/kotlin/plugin.jar
          for dir in node-typescript python kotlin; do
            bash "template/$dir/pack.sh"
          done
          # 入口要在包里，光有元数据不算能跑。
          test -f template/kotlin/dist/MyKotlinPlugin/plugin.jar

      # 信封由打包器生成：type 是路由键，清单留在源码树外的输出里。
      - name: 检查产物形状
        run: |
          set -euo pipefail
          for pair in node-typescript:MyNodePlugin python:MyPythonPlugin kotlin:MyKotlinPlugin; do
            dir=${pair%%:*}
            name=${pair##*:}
            package="template/$dir/dist/$name"
            test -f "$package/hosihikari.json"
            test "$(node -p "require('./$package/hosihikari.json').apiVersion")" = 3
            test "$(node -p "require('./$package/manifest.json').type")" = hosihikari
            test ! -f "template/$dir/manifest.json"
          done
